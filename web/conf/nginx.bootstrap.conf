# Temporary http-only server used only during first Let's Encrypt webroot issuance.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 200 "provisioning TLS certificate...\n";
        add_header Content-Type text/plain;
    }
}
