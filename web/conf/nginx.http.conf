server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed assets under /assets/. They are immutable
    # and safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — any unknown route serves index.html so client-side
    # routing (react-router) takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy. proxy_buffering off is required for the AI chat
    # streaming endpoint (/api/ai/chat) to flush tokens incrementally.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Uploaded avatars are served by the Go app's /avatars static route.
    location /avatars/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
}
