# WebSocket upgrade header mapping (http{} context). Used by /api/ws below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    # SPA frame-ancestors: self only (an iframe of the app could otherwise
    # overlay clicks — clickjacking). nosniff stops MIME confusion on uploaded
    # avatars; no referrer leakage to third parties.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; # inline theme-bootstrap in index.html; revisit with subresource integrity connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Compress text assets on the fly. The SPA ships ~500KB of JS/CSS that
    # drops to ~130KB gzipped; without this everything crosses the wire raw.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/json text/css image/svg+xml text/plain;
    # NOTE: text/event-stream (AI chat SSE) is deliberately NOT listed —
    # compressing it would buffer tokens and break incremental rendering.

    # Vite emits content-hashed assets under /assets/. They are immutable
    # and safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html pins the hashed asset URLs, so it must always be
    # revalidated after a deploy (no-cache ≠ no-store: ETag still works).
    # try_files' SPA fallback internally redirects here too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — any unknown route serves index.html so client-side
    # routing (react-router) takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket upgrade for real-time todo sync. Exact match takes priority over
    # the /api/ prefix; long timeouts keep idle sockets alive.
    location = /api/ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API reverse proxy. proxy_buffering off is required for the AI chat
    # streaming endpoint (/api/ai/chat) to flush tokens incrementally.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Uploaded avatars are served by the Go app's /avatars static route.
    location /avatars/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }
}
