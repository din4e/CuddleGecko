# Release pipeline for the CuddleGecko WEB SERVER (this repo).
#
# On a `v*` tag push (or manual dispatch), builds the Go server binary per
# platform with the version stamped via ldflags, and uploads per-platform
# archives to the matching GitHub Release. Archives follow go-selfupdate's
# naming convention ({cmd}_{os}_{arch}.{ext}, containing an executable named
# {cmd}) — the same convention the desktop app's in-app updater consumes, so
# either client can self-update against these assets.
#
# NOTE: the Wails desktop pipeline lives in the CuddleGeckoDesktop repo since
# the split (commit 03a8f82) — this repo ships the web backend + frontend.
# NOTE: validate on the first real tag push — cross-compile CGO/sqlite is the
# usual source of tweaks.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (tag without leading v is fine)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: cuddlegecko_linux_amd64.tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset: cuddlegecko_linux_arm64.tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: cuddlegecko_windows_amd64.zip
          - os: macos-latest
            goos: darwin
            goarch: universal
            asset: cuddlegecko_darwin_universal.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # CGO toolchain for mattn/go-sqlite3 (unconditionally imported by
      # pkg/database, so CGO stays on even when deployment runs MySQL).
      - name: Install cross-compile toolchains (linux/arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build server binary
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ (matrix.goos == 'linux' && matrix.goarch == 'arm64') && 'aarch64-linux-gnu-gcc' || '' }}
        run: >
          go build -ldflags "-X github.com/din4e/cuddlegecko/internal/version.Version=$VERSION -s -w" -trimpath
          -o out/cuddlegecko${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/server

      # macOS universal: build both arches and lipo them together.
      - name: Build universal binary (macos)
        if: matrix.goos == 'darwin'
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/din4e/cuddlegecko/internal/version.Version=$VERSION -s -w" -trimpath -o out/cuddlegecko-amd64 ./cmd/server
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/din4e/cuddlegecko/internal/version.Version=$VERSION -s -w" -trimpath -o out/cuddlegecko-arm64 ./cmd/server
          lipo -create -output out/cuddlegecko out/cuddlegecko-amd64 out/cuddlegecko-arm64

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        run: tar -czf ${{ matrix.asset }} -C out cuddlegecko

      - name: Package (zip)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: Compress-Archive -Path out/cuddlegecko.exe -DestinationPath ${{ matrix.asset }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
