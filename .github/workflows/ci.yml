# CI for the CuddleGecko web backend (Gin/GORM) + React frontend.
#
# DISABLED for automatic runs (2026-08-30, owner request) — manual dispatch
# only. To re-enable, restore the push/pull_request triggers below.
# Full suite when run manually: Go build/vet/test, a govulncheck audit
# (catches reachable dependency CVEs before they land — two were found and
# patched manually in Aug 2026), the frontend type-check, eslint, and vitest.
#
# NOTE: the frontend type-check uses `tsc -p tsconfig.app.json --noEmit`;
# a bare `tsc --noEmit` at the repo root is a NO-OP (empty files + project
# references) and silently checks nothing.

name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./internal/... ./pkg/...
      - name: Test
        run: go test ./internal/... ./pkg/... -race -count=1
      - name: Benchmarks (run-only, no threshold — catches panics + locks in a numbers trail)
        run: go test ./internal/repository/... ./internal/service/... -bench 'BenchmarkTodoStats|BenchmarkWorkoutStats|BenchmarkTransactionMonthly' -benchtime=5x -run xxx
      - name: Vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check (app project — root tsconfig checks nothing)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: npm run build
