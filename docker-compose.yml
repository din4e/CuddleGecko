services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not exposed to host — only the app service reaches it on the compose network.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CG_SERVER_MODE: release
      CG_SERVER_PORT: "8080"
      CG_JWT_SECRET: ${CG_JWT_SECRET:?set CG_JWT_SECRET in .env (>=32 chars)}
      CG_DATABASE_DRIVER: mysql
      # DSN is composed here from MYSQL_* so password special chars need no escaping in .env
      CG_DATABASE_MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local"
      CG_SERVER_AVATAR_DIR: /data/avatars
    volumes:
      - avatar_data:/data/avatars
    # Not exposed to host — the web container reverse-proxies /api and /avatars.

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"   # SSL_ENABLED=false → no :443 server block → connection refused (no side effect)
    environment:
      SSL_ENABLED: ${SSL_ENABLED:-false}
      SSL_MODE: ${SSL_MODE:-selfsigned}
      SSL_DOMAIN: ${SSL_DOMAIN:-}
      SSL_EXTRA_DOMAINS: ${SSL_EXTRA_DOMAINS:-}
      SSL_EMAIL: ${SSL_EMAIL:-}
      SSL_CERT_DIR: /etc/nginx/certs
      SSL_LE_CHALLENGE: ${SSL_LE_CHALLENGE:-webroot}
      SSL_LE_DNS_PROVIDER: ${SSL_LE_DNS_PROVIDER:-}
      SSL_USE_CA: ${SSL_USE_CA:-false}
      SSL_HSTS: ${SSL_HSTS:-true}
      SSL_LE_STAGING: ${SSL_LE_STAGING:-false}
      # DNS-01 provider credentials (only needed when SSL_LE_CHALLENGE=dns).
      # Cloudflare and Aliyun are pre-wired; for other acme.sh DNS providers, add
      # their env vars here (e.g. DP_Id/DP_Key, GD_Key/GD_Secret, …) and set them in .env.
      CF_Token: ${CF_Token:-}
      CF_Account_Id: ${CF_Account_Id:-}
      CF_Zone_ID: ${CF_Zone_ID:-}
      Ali_Key: ${Ali_Key:-}
      Ali_Secret: ${Ali_Secret:-}
    volumes:
      - ${SSL_CERT_DIR:-./data/certs}:/etc/nginx/certs
      - acme_data:/root/.acme.sh

volumes:
  mysql_data:
  avatar_data:
  acme_data:
