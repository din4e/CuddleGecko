services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not exposed to host — only the app service reaches it on the compose network.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CG_SERVER_MODE: release
      CG_SERVER_PORT: "8080"
      CG_JWT_SECRET: ${CG_JWT_SECRET:?set CG_JWT_SECRET in .env (>=32 chars)}
      CG_DATABASE_DRIVER: mysql
      # DSN is composed here from MYSQL_* so password special chars need no escaping in .env
      CG_DATABASE_MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?charset=utf8mb4&parseTime=True&loc=Local"
      CG_SERVER_AVATAR_DIR: /data/avatars
    volumes:
      - avatar_data:/data/avatars
    # Not exposed to host — the web container reverse-proxies /api and /avatars.

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"

volumes:
  mysql_data:
  avatar_data:
