server:
  port: 8080
  mode: debug

database:
  driver: sqlite
  sqlite_path: ./data/cuddlegecko.db
  mysql_dsn: ""

jwt:
  secret: "change-me-in-production-please-use-at-least-32-chars"
  access_ttl: 15m
  # Session lifetime: how long a user can stay away before re-login. The
  # refresh token rotates (slides) on every visit, so active users never see
  # a login prompt. Env override: CG_JWT_REFRESH_TTL (e.g. 2160h = 90 days).
  refresh_ttl: 720h

log:
  level: info
  format: json

captcha:
  enabled: false

cors:
  allow_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
